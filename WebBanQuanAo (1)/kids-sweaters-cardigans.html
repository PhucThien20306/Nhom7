<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>LifeWear - Kids Sweater & Cardigans</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <link rel="stylesheet" href="kids-sweaters-cardigans.css" />
</head>
<body>
  <div class="product-list-page">

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <a href="kids.html" class="brand">
          <div class="brand-logo">QT</div>
          <span>LifeWear</span>
        </a>

        <nav class="nav">
          <a href="men.html">Men</a>
          <a href="women.html">Women</a>
          <a href="kids.html" class="active">Kids</a>
          <a href="baby.html">Baby</a>
        </nav>
      </div>

      <div class="header-right">
        <form class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search" />
        </form>

        <div class="header-icons">
          <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
          <a href="wishlist.html"><i class="fa-regular fa-heart"></i></a>
          <a href="login.html"><i class="fa-regular fa-user"></i></a>
          <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
          <a href="#"><i class="fa-solid fa-bars"></i></a>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main">
      <section class="container">

        <!-- TITLE -->
        <h1 class="page-title">Sweater &amp; Cardigans</h1>

        <!-- SUB CATEGORIES -->
        <section class="sub-category-list">
          <a href="#" class="sub-category-item">
            <img
              src="images/img206.avif"
              alt="All Sweaters & Cardigans"
            />
            <p>All Sweaters & Cardigans</p>
          </a>

          <a href="#" class="sub-category-item">
            <img
              src="images/img207.avif"
              alt="Sweaters & Cardigans"
            />
            <p>Sweaters & Cardigans</p>
          </a>
        </section>

        <!-- FILTER -->
        <section class="filter-section">
          <div class="store-row">
            <p>Select a store to search store stock</p>
            <a href="#">Select store</a>
          </div>

          <div class="filter-list">
            <button>In-stock: online only</button>
            <button>Gender &gt; Category</button>
            <button>Options</button>
            <button>Size</button>
            <button>Color</button>
            <button>Price</button>
          </div>
        </section>

        <!-- NO RESULT -->
        <section class="no-result">
          <p>There are no results that match your filter.</p>
          <a href="#">Clear all</a>
        </section>

      </section>
    </main>

  </div>
  <script src="main.js"></script>
</body>
</html>
