<body>
  <div class="ut-page">

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <a href="baby.html" class="brand">
          <div class="brand-logo">QT</div>

    <!-- MAIN -->
    <main class="main">
      <section class="container">

        <h1 class="page-title">UT Collections</h1>

        <!-- UT CATEGORY ICONS -->
        <section class="ut-category-list">
          <a href="#" class="ut-category-item">
            <div class="category-icon new-icon">NEW</div>

          </a>

          <a href="#" class="ut-category-item">
            <div class="category-icon">

          </a>

          <a href="#" class="ut-category-item">
            <div class="category-icon">
              <i class="fa-solid fa-child-reaching"></i>
            </div>
            <p>Character</p>
          </a>

          <a href="#" class="ut-category-item">
            <div class="category-icon magic-icon">
              <span>Disney</span>
              <strong>UN<br />IQLO</strong>
            </div>
            <p>Magic For All</p>
          </a>

          <div class="collection-grid">
            <article class="collection-main-card">
              <img
                src="images/img236.avif"
                alt="Musical Icons"

            </article>

            <article class="ut-product">
              <img
                src="images/img237.avif"
                alt="Musical Icons T-Shirt Green"

              />

          <div class="collection-heading simple-heading">
            <div>
