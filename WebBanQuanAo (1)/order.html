<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>LifeWear - Product Detail</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <link rel="stylesheet" href="order.css" />
</head>
<body>
  <div class="order-page">

    <!-- PROMOTION BAR -->
    <section class="promo-bar">
      <div class="promo-inner">
        <p>Save on Summer Essentials | Shop Now</p>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
    </section>

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <a href="men.html" class="brand">
          <div class="brand-logo">QT</div>
          <span>LifeWear</span>
        </a>

        <nav class="nav">
          <a href="men.html" class="active">Men</a>
          <a href="women.html">Women</a>
          <a href="kids.html">Kids</a>
          <a href="baby.html">Baby</a>
        </nav>
      </div>

      <div class="header-icons">
        <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="wishlist.html"><i class="fa-regular fa-heart"></i></a>
        <a href="login.html"><i class="fa-regular fa-user"></i></a>
        <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
        <a href="#"><i class="fa-solid fa-bars"></i></a>
      </div>
    </header>

    <!-- PRODUCT DETAIL -->
    <main class="product-main">
      <section class="product-container">

        <!-- PRODUCT IMAGES -->
        <div class="product-gallery">
          <div class="product-image">
            <img
              src="images/img39.avif"
              alt="Premium Linen Shirt Olive"
            />
            <span class="image-caption">Height: 6'0&quot;/184cm<br>Size:L</span>
          </div>

          <div class="product-image">
            <img
              src="images/img42.avif"
              alt="Premium Linen Shirt Blue"
            />
            <span class="image-caption">Height:5'11&quot;/180cm<br>Size:M</span>
          </div>
        </div>

        <!-- PRODUCT INFO -->
        <aside class="product-info">

          <div class="badge-row">
            <span class="badge">Bestseller</span>
          </div>

          <!-- COLOR -->
          <div class="option-block color-block">
            <p class="option-label">Color: 57 OLIVE</p>

            <div class="color-list">
              <button class="color active" style="--color:#6f7563" aria-label="Olive"></button>
              <button class="color" style="--color:#f4f4f4" aria-label="White"></button>
              <button class="color" style="--color:#34353a" aria-label="Dark Gray"></button>
              <button class="color" style="--color:#f4a6b7" aria-label="Pink"></button>
              <button class="color" style="--color:#e9e5df" aria-label="Natural"></button>
              <button class="color" style="--color:#c8b99e" aria-label="Beige"></button>
              <button class="color" style="--color:#7b5f50" aria-label="Brown"></button>
              <button class="color" style="--color:#f7efb7" aria-label="Yellow"></button>
              <button class="color" style="--color:#d9e5dc" aria-label="Mint"></button>
              <button class="color" style="--color:#bac7b3" aria-label="Light Olive"></button>
              <button class="color" style="--color:#c2ddf0" aria-label="Light Blue"></button>
              <button class="color" style="--color:#4c6d99" aria-label="Blue"></button>
              <button class="color" style="--color:#2e3c4d" aria-label="Navy"></button>
            </div>
          </div>

          <!-- SIZE -->
          <div class="option-block">
            <p class="option-label">Size: Men M</p>

            <div class="size-list">
              <button>XS</button>
              <button>S</button>
              <button class="active">M</button>
              <button>L</button>
              <button>XL</button>
              <button>XXL</button>
              <button>3XL</button>
            </div>

            <a href="#" class="size-guide">
              <i class="fa-solid fa-ruler-horizontal"></i>
              Size Guide
            </a>
          </div>

          <!-- PRICE + RATING -->
          <div class="price-rating-row">
            <p class="price">$49.90</p>

            <div class="rating">
              <span class="stars">★★★★☆</span>
              <strong>4.6</strong>
              <a href="#">(415)</a>
            </div>
          </div>

          <!-- BUY ACTION -->
          <div class="buy-row">
            <div class="quantity-box">
              <button type="button">-</button>
              <span>1</span>
              <button type="button">+</button>
            </div>

            <a href="cart.html" class="add-cart-btn">
              ADD TO CART
            </a>
          </div>

          <p class="stock-text">In stock</p>

          <!-- ACTIONS -->
          <div class="product-actions">
            <a href="#" class="icon-action" aria-label="Share">
              <i class="fa-solid fa-arrow-up-from-bracket"></i>
            </a>

            <a href="#" class="wishlist-btn">
              <i class="fa-regular fa-heart"></i>
              ADD TO WISHLIST
            </a>
          </div>

          <a href="#" class="coupon-link">
            <i class="fa-solid fa-ticket"></i>
            Use your coupon before it expires on 6/16/2026
          </a>

        </aside>

      </section>
    </main>

  </div>
  <script src="main.js"></script>
</body>
</html>
