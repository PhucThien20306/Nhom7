<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>LifeWear - Search</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <link rel="stylesheet" href="search.css" />
</head>
<body>
  <div class="search-page">

    <main class="search-container">

      <!-- TOP SEARCH -->
      <section class="search-top">
        <a href="men.html" class="back-btn" aria-label="Back">
          <i class="fa-solid fa-chevron-left"></i>
        </a>

        <form class="main-search-box">
          <input type="text" placeholder="Search" />
        </form>

        <a href="men.html" class="close-btn" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </a>
      </section>

      <!-- QUICK MENU -->
      <section class="quick-menu">
        <a href="#" class="quick-item">
          <i class="fa-solid fa-camera"></i>
          <span>Image Search</span>
        </a>

        <a href="#" class="quick-item">
          <i class="fa-solid fa-bag-shopping"></i>
          <span>Store</span>
        </a>

        <a href="#" class="quick-item">
          <i class="fa-solid fa-message"></i>
          <span>FAQ</span>
        </a>
      </section>

      <!-- TRENDING -->
      <section class="trending-section">
        <h2>Trending</h2>

        <div class="trending-list">
          <a href="#" class="trend-chip">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Cecilie Bahnsen</span>
          </a>

          <a href="#" class="trend-chip">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Shorts</span>
          </a>

          <a href="#" class="trend-chip">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Linen</span>
          </a>

          <a href="#" class="trend-chip">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>UT: Graphic Tee...</span>
          </a>

          <a href="#" class="trend-chip">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Bra Top</span>
          </a>

          <a href="#" class="trend-chip">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>AIRism</span>
          </a>
        </div>
      </section>

      <!-- SEARCH HISTORY -->
      <section class="history-section">
        <div class="history-header">
          <h2>Search History</h2>

          <button type="button" class="delete-btn" aria-label="Delete search history">
            <i class="fa-regular fa-trash-can"></i>
          </button>
        </div>

        <div class="history-line"></div>

        <p class="history-text">
          You can see your search history here.
        </p>
      </section>

      <!-- CATEGORY CTA -->
      <section class="category-cta">
        <h2>Can’t find what you’re looking for?</h2>

        <a href="men.html" class="category-btn">
          SEARCH BY CATEGORY
        </a>
      </section>

    </main>

  </div>
  <script src="main.js"></script>
</body>
</html>
